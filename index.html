<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>打卡仪表盘</title>
<style>
:root{
--fg:#18181b;--fg2:#4b5563;--muted:#8b8b93;--line:#ececf1;
--bg:#f4f4f7;--card:#fff;--accent:#0a7cff;--accent-2:#eaf3ff;
--green:#16a34a;--green-2:#e7f7ee;--red:#e5484d;--red-2:#fdecec;
--purple:#7c3aed;--purple-2:#f3ecfe;--amber:#d97706;--gray:#d4d4d8;
--r-lg:18px;--r-md:12px;--r-sm:8px;
--sh:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 44px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:0 0 16px}
h1{font-size:21px;line-height:1.25;margin:0;letter-spacing:-.02em;font-weight:700}
.updated{color:var(--muted);font-size:12px;line-height:1.45;text-align:right;flex-shrink:0}
.nav{display:flex;gap:6px;margin:0 0 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;
scrollbar-width:none;padding-bottom:2px}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:1 1 0;min-width:0;white-space:nowrap;text-align:center;padding:9px 4px;border-radius:var(--r-md);
background:var(--card);box-shadow:var(--sh);font-size:12.5px;color:var(--fg2);text-decoration:none}
.nav a.on{background:var(--accent);color:#fff;font-weight:600}
.tabs{display:flex;gap:8px;margin:0 0 14px}
.tab{flex:1;padding:11px;border:none;border-radius:var(--r-md);background:var(--card);box-shadow:var(--sh);
font:600 15px/1 inherit;color:var(--fg2);cursor:pointer}
.tab.active{background:var(--accent);color:#fff}
.panel,.distsec,.detail,.chartbox{background:var(--card);border-radius:var(--r-lg);padding:16px;
overflow-wrap:anywhere;
box-shadow:var(--sh);margin:0 0 14px}
.panel h2,.detail h2{font-size:16px;line-height:1.35;margin:0 0 10px;font-weight:700}
.panel h3{font-size:12px;color:var(--muted);margin:16px 0 8px;font-weight:600;letter-spacing:.02em}
.sec-t{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 10px}
.summary{font-size:13px;line-height:1.6;color:var(--fg2);margin:0 0 12px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 0 14px}
@media(min-width:640px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:var(--card);border-radius:var(--r-lg);padding:14px;box-shadow:var(--sh);min-width:0}
.card .t{font-size:12px;line-height:1.5;color:var(--muted)}
.card .v{font-size:19px;line-height:1.3;font-weight:700;margin:4px 0 2px;letter-spacing:-.01em}
.card .sub{font-size:12px;line-height:1.6;color:var(--fg2);margin-top:2px}
.card .sub b{color:var(--fg)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12px}
tr:last-child td{border-bottom:none}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px}
.tag.ok{background:var(--green-2);color:var(--green)}
.tag.bad{background:var(--red-2);color:var(--red)}
.tag.warn{background:#f4f4f7;color:var(--fg2)}
.empty{color:var(--muted);font-size:14px;line-height:1.6;padding:8px 0}
.hint{color:var(--muted);font-size:12px;line-height:1.7;text-align:center;margin:16px 0 0}

.legend{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:12px;
line-height:1.5;color:var(--fg2);margin:0 0 12px}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.plotwrap{display:flex;gap:6px;align-items:flex-start}
@media(max-width:400px){.panel,.distsec,.detail,.chartbox{padding:14px 12px}}
.yaxis{position:relative;flex:0 0 32px;width:32px;height:180px;font-size:11px;color:var(--muted)}
.yaxis span{position:absolute;right:4px;transform:translateY(50%);white-space:nowrap}
.vscroll{flex:1;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
padding-bottom:2px}
.vscroll::-webkit-scrollbar{display:none}
.vinner{display:flex;flex-direction:column}
.plots{display:flex;align-items:flex-end;justify-content:flex-start;gap:5px;height:180px;border-radius:var(--r-sm);
background:repeating-linear-gradient(to top,var(--line) 0 1px,transparent 1px 45px)}
.col{flex:1 1 0;min-width:34px;max-width:58px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;
align-items:center;cursor:pointer;border-radius:var(--r-sm) var(--r-sm) 0 0;transition:background .15s}
.col:hover{background:#fafafc}
.col.sel{background:var(--accent-2)}
.stack{position:relative;width:100%;display:flex;flex-direction:column;justify-content:flex-end;
align-items:center;height:100%}
.seg{width:26px;flex:0 0 auto}
.seg.study{background:var(--green);border-radius:6px 6px 0 0}
.col.miss .seg.study{background:var(--red)}
.col.none .seg.study{background:var(--gray)}
.col.agg .seg.study{background:var(--accent)}
.seg.game{background:var(--purple);border-radius:0}
.stack>.seg.game:last-child{border-radius:0 0 0 0}
.seg.game.top{border-radius:6px 6px 0 0}
.zero{width:26px;height:3px;border-radius:2px;background:var(--gray);flex:0 0 auto}
.ftick{position:absolute;left:50%;transform:translateX(-50%);width:30px;height:0;
border-top:2px dashed rgba(10,124,255,.5);pointer-events:none}
.xlabels{display:flex;gap:5px;padding-top:8px}
.xcol{flex:1 1 0;min-width:34px;max-width:58px;text-align:center;overflow:visible;min-height:52px}
.xcol .v{font-size:11px;line-height:1.5;color:var(--fg);font-weight:700;white-space:nowrap}
.xcol .d{font-size:11px;line-height:1.5;color:var(--muted);white-space:nowrap}
.xcol .g{font-size:10px;line-height:1.5;color:var(--purple);font-weight:600;white-space:nowrap}
.axisnote{font-size:11.5px;line-height:1.7;color:var(--muted);margin:8px 0 0;text-align:center}
.detail .daytot{font-size:13px;line-height:1.7;color:var(--fg2);margin:0 0 10px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;margin-left:8px}
.pill.ok{background:var(--green-2);color:var(--green)}
.pill.miss{background:var(--red-2);color:var(--red)}
.pill.none{background:#f4f4f7;color:var(--muted)}
.cathead{font-size:12px;color:var(--accent);margin:14px 0 2px;font-weight:700;
letter-spacing:.02em}
.entry{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.entry:last-child{border-bottom:none}
.entry .rng{color:var(--muted);font-size:12.5px;margin-left:6px}
.entry .dur{color:var(--fg);font-weight:700;white-space:nowrap;font-size:13px}
.entry.warn .rng{color:var(--amber);font-weight:600}
.drow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:12.5px}
.dlab{width:58px;color:var(--fg2);white-space:nowrap;flex-shrink:0}
.dbar{flex:1;height:10px;background:#f1f1f5;border-radius:99px;overflow:hidden;min-width:0}
.dfill{height:100%;border-radius:99px}
.dnum{width:46px;text-align:right;color:var(--fg2);flex-shrink:0;white-space:nowrap}
.dempty{color:var(--muted);font-size:13px;line-height:1.6;padding:4px 0}
.rankline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
font-size:13px;line-height:1.6;margin:6px 0 8px}
.rankline .rlab{font-weight:700}
.rankline .rnum{color:var(--muted);text-align:right}
.seg2{display:inline-flex;background:#e8e8ed;border-radius:99px;padding:3px;margin:0 0 14px}
.seg2 button{border:none;background:transparent;padding:7px 16px;border-radius:99px;
font:600 13px/1 inherit;color:var(--fg2);cursor:pointer}
.seg2 button.on{background:var(--card);color:var(--fg);box-shadow:var(--sh)}
.gp-grid{display:flex;align-items:flex-end;gap:6px;height:110px}
.gp-col{flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;
justify-content:flex-end;align-items:center;cursor:default}
.gp-bar{width:100%;max-width:34px;background:var(--purple);border-radius:6px 6px 0 0;min-height:3px}
.gp-bar.off{background:#e6e6ec}
</style></head><body><div class="wrap">

segY.onclick=()=>{mode='year';selSeg();render();};
function sparkSVG(p){
 const t=p.balance_trend;
 if(!t||t.length<2)return '';
 const W=110,H=32,pad=3;
 const vals=t.map(x=>x.balance);
 const mn=Math.min(...vals,0), mx=Math.max(...vals,0);
 const rng=(mx-mn)||1;
 const X=i=>pad+i*(W-2*pad)/(t.length-1);
 const Y=v=>pad+(mx-v)/rng*(H-2*pad);
 let d='M'+X(0).toFixed(1)+' '+Y(vals[0]).toFixed(1);
 for(let i=1;i<vals.length;i++)d+=' L'+X(i).toFixed(1)+' '+Y(vals[i]).toFixed(1);
 const zy=Y(0).toFixed(1);
 const up=vals[vals.length-1]>=vals[0];
 return '<svg width="'+W+'" height="'+H+'" style="display:block;margin-top:6px">'+
  '<line x1="'+pad+'" y1="'+zy+'" x2="'+(W-pad)+'" y2="'+zy+'" stroke="#e5e5ea" stroke-width="1"/>'+
  '<path d="'+d+'" fill="none" stroke="'+(up?'#34c759':'#ff3b30')+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
  '</svg>';
}
function legendHTML(){
 return '<span><i style="background:var(--green)"></i>达标</span>'+
  '<span><i style="background:var(--red)"></i>未达标</span>'+
  '<span><i style="background:var(--gray)"></i>休息日</span>'+
  '<span><i style="background:var(--purple)"></i>游戏（不占保底）</span>'+
  '<span><i style="width:16px;height:0;border-radius:0;border-top:2px dashed rgba(10,124,255,.6)"></i>保底线</span>';
}
const PLOT_H=180;   /* 必须和 CSS 里 .plots / .yaxis 的 height 一致 */
function fmtTick(m){return m>=60?fmt(Math.round(m)):(Math.round(m)+'m');}
/* 柱子下面的数字专用紧凑写法：`1h57m` → `1h57`，窄屏一行放得下 */
function fmtC(m){if(!m)return'';if(m<60)return m+'m';const h=Math.floor(m/60),mm=m%60;return h+'h'+(mm?String(mm).padStart(2,'0'):'');}
function renderYAxis(maxMin){
 const y=document.getElementById('yaxis');y.style.height=PLOT_H+'px';let h='';
 for(let k=0;k<=4;k++)h+='<span style="bottom:'+(25*k)+'%">'+fmtTick(maxMin*k/4)+'</span>';
 y.innerHTML=h;
}
function stackHTML(study,game,max){
 let h='';const gh=game?game/max*100:0,sh=study?study/max*100:0;
 if(gh>0)h+='<div class="seg game'+(sh<=0?' top':'')+'" style="height:'+gh.toFixed(2)+'%" title="🎮 游戏 '+fmt(game)+'"></div>';
 if(sh>0)h+='<div class="seg study" style="height:'+sh.toFixed(2)+'%" title="📚 学习 '+fmt(study)+'"></div>';
 if(gh<=0&&sh<=0)h='<div class="zero"></div>';
 return h;
}
function cardHTML(p){
 const tw=p.this_week,tm=p.this_month,ym=DATA.updated.slice(0,7),c=p.cards||{};
 return '<div class="card"><div class="t">本周 '+DATA.week+'</div>'+
   '<div class="v">'+tw.floor_days+'/'+tw.days+' 天</div>'+
   '<div class="sub">学习 '+fmt(tw.study)+(tw.game?' ｜ 🎮 '+fmt(tw.game):'')+'</div></div>'+
  '<div class="card"><div class="t">本月 '+ym+'</div>'+
   '<div class="v">'+tm.floor_days+'/'+tm.days+' 天</div>'+
   '<div class="sub">学习 '+fmt(tm.study)+(tm.game?' ｜ 🎮 '+fmt(tm.game):'')+'</div></div>'+
  '<div class="card"><div class="t">积分余额</div><div class="v">'+p.balance+' 分</div>'+sparkSVG(p)+'</div>'+
  '<div class="card"><div class="t">🎟 愿望卡</div><div class="v">'+(c.available||0)+' 张</div>'+
   '<div class="sub">积分换 '+(c.point_cards||0)+' + 赠送 '+(c.gift_left||0)+' ｜ 已用 '+(c.used||0)+' 张</div>'+
   '<div class="sub">'+(c.week_gap?('本周达标 '+c.week_days+'/'+c.week_need+' 天 → 再 '+c.week_gap+' 天送 1 张'):
     ('本周达标 '+c.week_days+' 天 → 满 '+c.week_need+' 天送 1 张'))+'</div></div>';
}
function xcolHTML(vMain,dLabel,games){
 return '<div class="v">'+(vMain||'—')+'</div><div class="d">'+dLabel+'</div>'+
   (games?'<div class="g">'+games+'</div>':'');
}
function renderDayDetail(d){
 const pill=d.status==='ok'?'达标':(d.status==='miss'?'未达标':'休息日');
 let h='<h2>'+esc(d.d)+'<span class="pill '+d.status+'">'+pill+'</span>'+
   '<span class="pill none">学习 '+fmt(d.study)+' / '+fmt(d.floor)+'</span>'+
   (d.game?'<span class="pill" style="background:var(--purple-2);color:var(--purple)">🎮 '+fmt(d.game)+'</span>':'')+'</h2>';
 h+='<div class="daytot">⏱ 当天计时总时长 <b>'+fmt(d.total)+'</b>'+
    (d.total>0?'（含通用打卡，不计入保底）':'')+'</div>';
 if(!d.items.length)h+='<div class="empty">这天没有记录</div>';
 else{let curCat=null;
  d.items.forEach(it=>{
   if(it.cat!==curCat){curCat=it.cat;h+='<div class="cathead">'+esc(CL[it.cat]||it.cat)+'</div>';}
   h+='<div class="entry'+(it.warn?' warn':'')+'"><span>'+esc(it.name)+
      (it.range?'<span class="rng">'+esc(it.range)+'</span>':'')+'</span>'+
      '<span class="dur">'+esc(it.dur)+'</span></div>';
  });}
 document.getElementById('detail').innerHTML=h;
}
function renderDays(p,days){
 const plots=document.getElementById('plots'),xl=document.getElementById('xlabels');
 const max=Math.max(120,...days.map(d=>Math.max(d.study+(d.game||0),d.floor)));
 renderYAxis(max);
 days.forEach((d,i)=>{
  const col=document.createElement('div');
  col.className='col '+d.status+(i===curD?' sel':'');
  const st=document.createElement('div');st.className='stack';
  st.innerHTML=stackHTML(d.study,d.game,max);
  if(d.floor>0){const f=document.createElement('div');f.className='ftick';
   f.style.bottom=(d.floor/max*100).toFixed(2)+'%';st.appendChild(f);}
  col.appendChild(st);
  col.onclick=()=>{curD=i;render();saveState();};
  plots.appendChild(col);
  const c=document.createElement('div');c.className='xcol';
  c.innerHTML=xcolHTML(fmtC(d.study),d.d.slice(5).replace('-','/'),fmtC(d.game));
  xl.appendChild(c);
 });
 renderDayDetail(days[curD]);
}
function renderAgg(list,title,getCur,setCur){
 const plots=document.getElementById('plots'),xl=document.getElementById('xlabels');
 if(!list.length){plots.innerHTML='';xl.innerHTML='';
  document.getElementById('detail').innerHTML='<div class="empty">还没有数据</div>';return;}
 let cur=getCur();if(cur>=list.length)cur=list.length-1;setCur(cur);
 const max=Math.max(120,...list.map(w=>w.study+(w.game||0)));
 renderYAxis(max);
 list.forEach((w,i)=>{
  const col=document.createElement('div');col.className='col agg'+(i===cur?' sel':'');
  const st=document.createElement('div');st.className='stack';
  st.innerHTML=stackHTML(w.study,w.game,max);
  col.appendChild(st);col.onclick=()=>{setCur(i);render();};
  plots.appendChild(col);
  const c=document.createElement('div');c.className='xcol';
  c.innerHTML=xcolHTML(fmtC(w.study),w.label,fmtC(w.game));
  xl.appendChild(c);
 });
 const w=list[cur];
 let h='<h2>'+esc(w.label)+'<span class="pill none">'+title+'</span></h2>';
 h+='<div class="daytot">学习 <b>'+fmt(w.study)+'</b> · 达标 <b>'+w.floor_days+'/'+w.days+'</b> 天'+
    (w.game?' · 🎮 游戏 <b>'+fmt(w.game)+'</b>':'')+
    (w.cards?' · 🎟 愿望卡 <b>'+w.cards+'</b> 张':'')+'</div>';
 document.getElementById('detail').innerHTML=h;
}
function renderWeeks(p){renderAgg(p.weeks,'周汇总',()=>curW,i=>{curW=i;});}
function renderMonths(p){renderAgg(p.months,'月汇总',()=>curM,i=>{curM=i;});}
function renderYears(p){renderAgg(p.years,'年汇总',()=>curY,i=>{curY=i;});}
function renderGame(p){
 const el=document.getElementById('gamepanel'),days=p.days;
 const total=days.reduce((a,b)=>a+(b.game||0),0);
 const tw=p.this_week.game||0,tm=p.this_month.game||0;
 if(!total){el.innerHTML='<h2>🎮 游戏时长</h2><p class="empty">这段时间没有游戏记录'+
   '（游戏只记录、不占学习时长，不参与判定）</p>';return;}
 const max=Math.max(30,...days.map(d=>d.game||0));
 let bars='';
 days.forEach(d=>{const v=d.game||0;
  bars+='<div class="gp-col" title="'+esc(d.d)+'：'+fmt(v)+'">'+
   '<div class="gp-bar'+(v?'':' off')+'" style="height:'+(v?Math.max(v/max*100,3):3)+'%"></div></div>';});
 const top=days.filter(d=>d.game).sort((a,b)=>b.game-a.game).slice(0,3);
 el.innerHTML='<h2>🎮 游戏时长</h2>'+
  '<p class="sec-t">本周 <b>'+fmt(tw)+'</b> ｜ 本月 <b>'+fmt(tm)+'</b>'+
  (top.length?' ｜ 最多：'+top.map(d=>esc(d.d.slice(5))+' '+fmt(d.game)).join('、'):'')+'</p>'+
  '<div class="gp-grid">'+bars+'</div>'+
  '<p class="axisnote">每根柱子 = 一天（共 '+days.length+' 天）· 游戏只记录，不占学习时长</p>';
}

function distHTML(p){
 const d=p.card_dist||[];
 const total=d.reduce((a,b)=>a+b[1],0);
 if(!d.length)return '<div class="t">🎟 愿望卡消费</div><div class="dempty">还没用过愿望卡（14 分换 1 张，发「用卡 用途」）</div>';
 const colors=['#ff9500','#ff6b6b','#4ecdc4','#a29bfe','#fdcb6e','#b2bec3'];
 let h='<div class="t">🎟 愿望卡消费分布（共 '+total+' 张）</div>';
 d.forEach((x,i)=>{
  const cat=x[0],n=x[1],pct=Math.round(n/total*100);
  h+='<div class="drow"><span class="dlab">'+cat+'</span>'+
     '<div class="dbar"><div class="dfill" style="width:'+pct+'%;background:'+(colors[i%colors.length])+'"></div></div>'+
     '<span class="dnum">'+n+' 张</span></div>';
 });
 return h;
}
function moneyRankHTML(p){
 const c=p.cards||{};
 let h='<div class="t">💰 罚款：本周 <b>'+p.fine_week+' 元</b>'+
   (p.fine_paid?' · 已缴 <b>'+p.fine_paid+' 元</b>（还差 '+p.fine_unpaid+' 元）':'')+
   ' · 累计 '+p.fine_total+' 元</div>';
 h+='<div class="t">🎟 愿望卡：可用 <b>'+(c.available||0)+' 张</b>'+
   '（积分换 '+(c.point_cards||0)+' + 赠送剩 '+(c.gift_left||0)+'）'+
   ' · 积分 '+(c.points||0)+' 分 · 已用 '+(c.used||0)+' 张'+
   (c.granted&&c.granted.length?' · 已送 '+c.granted.join('、'):'')+'</div>';
 if(p.rank){
  h+='<div class="rankline"><span class="rlab">🏅 '+p.rank+'</span>'+
     '<span class="rnum">累计 '+p.total_floor+' 天'+
     (p.at_top?' · 已到顶':' · 距 '+p.next_rank+' 还差 '+p.remaining+' 天')+'</span></div>';
  if(!p.at_top){
   h+='<div class="dbar"><div class="dfill" style="width:'+p.rank_progress+'%;background:#007aff"></div></div>';
  }
 }
 return h;
}
function render(){
 const p=DATA.people[curP],days=p.days;
 document.getElementById('cards').innerHTML=cardHTML(p);
 document.getElementById('distsec').innerHTML=distHTML(p);
 document.getElementById('mrsec').innerHTML=moneyRankHTML(p);
 document.getElementById('legend').innerHTML=legendHTML();
 let sm=p.name+' · '+days.length+' 天 · 达标 '+
   days.filter(d=>d.status==='ok').length+'/'+
   days.filter(d=>d.status!=='none').length+' · 累计 '+fmt(days.reduce((a,b)=>a+b.study,0));
 if(DATA.transfer)sm+=' · 💸 '+DATA.transfer.pname+'→'+DATA.transfer.qname+' '+DATA.transfer.amount+' 元';
 document.getElementById('summary').textContent=sm;
 document.getElementById('plots').innerHTML='';
 document.getElementById('xlabels').innerHTML='';
 if(mode==='day')renderDays(p,days);
 else if(mode==='week')renderWeeks(p);
 else if(mode==='month')renderMonths(p);
 else renderYears(p);
 renderGame(p);
 const note={day:'点柱子看当天明细 · 竖条=学习，上面紫色一小截=游戏',
   week:'每周汇总 · 点柱子看该周',month:'每月汇总 · 点柱子看该月',year:'每年汇总 · 点柱子看该年'}[mode];
 document.getElementById('axisnote').textContent=note;
}
render();
(function(){const sel={day:curD,week:curW,month:curM,year:curY}[mode];const c=document.querySelectorAll('#plots .col')[sel];if(c)c.scrollIntoView({inline:'center',block:'nearest'});})();
// 60s 自刷新：带时间戳破 GitHub Pages 的 max-age=600 缓存
setTimeout(function(){var u=new URL(location.href);u.searchParams.set('t',Date.now());location.replace(u.toString());},60000);
</script></body></html>
