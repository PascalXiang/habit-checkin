<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>打卡仪表盘</title>
<style>
:root{--fg:#1c1c1e;--muted:#8e8e93;--green:#34c759;--red:#ff3b30;--gray:#c7c7cc;
--floor:#0a84ff;--bg:#f2f2f7;--card:#fff;--accent:#007aff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,"PingFang SC",sans-serif;
color:var(--fg);-webkit-tap-highlight-color:transparent}
.wrap{max-width:1020px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px 10px}
h1{font-size:24px;margin:0}
.updated{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:10px;border:none;border-radius:12px;background:var(--card);
font-size:15px;color:var(--muted);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tab.active{background:var(--accent);color:#fff}
.nav{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.nav a{flex:1 0 auto;white-space:nowrap;text-align:center;padding:9px 8px;border-radius:12px;background:var(--card);font-size:clamp(11px,3.1vw,14px);color:var(--muted);text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.nav a.on{background:var(--accent);color:#fff}
.summary{font-size:13px;color:var(--muted);margin:0 0 8px 2px}
.cards{display:flex;gap:8px;margin:0 2px 10px}
.card{flex:1;background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card .t{font-size:12px;color:var(--muted)}
.card .v{font-size:15px;font-weight:600;margin-top:2px}
.distsec{background:var(--card);border-radius:16px;padding:12px 14px;margin:0 2px 10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.distsec .t{font-size:12px;color:var(--muted);margin-bottom:8px}
.drow{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}
.dlab{width:56px;color:var(--muted);white-space:nowrap;flex-shrink:0}
.dbar{flex:1;height:12px;background:#f0f0f0;border-radius:6px;overflow:hidden}
.dfill{height:100%;border-radius:6px}
.dnum{width:36px;text-align:right;color:var(--fg);flex-shrink:0}
.dempty{color:var(--muted);font-size:13px;padding:4px 0}
.rankline{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin:4px 0 6px}
.rankline .rlab{font-weight:600}
.rankline .rnum{color:var(--muted)}
.seg{display:inline-flex;background:#e5e5ea;border-radius:10px;padding:2px;margin:0 0 10px 2px}
.seg button{border:none;background:transparent;padding:6px 16px;border-radius:8px;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.chart{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);
border-radius:16px;padding:14px 10px 6px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.track{display:flex;align-items:flex-end;gap:6px;min-width:max-content;height:220px}
.col{flex:0 0 46px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
cursor:pointer;position:relative;height:100%}
.bar{width:30px;border-radius:5px 5px 0 0;transition:height .2s}
.col.ok .bar{background:var(--green)} .col.miss .bar{background:var(--red)}
.col.none .bar{background:var(--gray)}
.col.sel{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.ftick{position:absolute;width:34px;height:2px;background:var(--floor);opacity:.7}
.mlabel{font-size:11px;color:var(--fg);margin-top:3px}
.dlabel{font-size:11px;color:var(--muted);margin-top:2px}
.detail{background:var(--card);border-radius:16px;padding:16px;margin-top:12px;
box-shadow:0 1px 4px rgba(0,0,0,.06)}
.detail h2{font-size:17px;margin:0 0 4px}
.daytot{font-size:13px;color:var(--muted);margin-bottom:10px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;margin-left:8px}
.pill.ok{background:#dff7e6;color:#1d7a3c} .pill.miss{background:#ffe3e0;color:#c0392b}
.pill.none{background:#eee;color:#8e8e93}
.cathead{font-size:13px;color:var(--accent);margin:12px 0 4px;font-weight:600}
.entry{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;
border-bottom:1px solid #f0f0f0;font-size:14px}
.entry:last-child{border-bottom:none}
.entry .rng{color:var(--muted);font-size:13px}
.entry .dur{color:var(--fg);font-weight:600;white-space:nowrap;font-size:13px}
.entry.warn .rng{color:#ff9500;font-weight:600}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.hint{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
</style></head><body><div class="wrap">
<header><h1>📊 打卡仪表盘</h1><span class="updated" id="updated"></span></header>
<div class="nav"><a class="on" href="index.html">📊 学习</a><a href="sleep.html">😴 睡眠</a><a href="ride.html">🚲 骑行</a><a href="toilet.html">🚽 如厕</a><a href="period.html">🩸 经期</a></div>
<div class="tabs" id="tabs"></div>
<p class="summary" id="summary"></p>
<div class="cards" id="cards"></div>
<div class="distsec" id="distsec"></div>
<div class="distsec" id="mrsec"></div>
<div class="seg"><button id="segD" class="on">📅 日</button><button id="segW">📈 周</button><button id="segM">🗓 月</button><button id="segY">📊 年</button></div>
<div class="chart"><div class="track" id="track"></div></div>
<div class="detail" id="detail"></div>
<p class="hint">← 左右滑动看全部日期 · 点柱子看当天明细 · 绿=达标 红=未达标 蓝杠=保底线</p>
</div>
<script>
const DATA={"updated": "2026-10-11 03:20", "week": "2026-W41", "start": "2026-10-06", "people": [{"code": "pascal", "name": "Pascal", "days": [{"d": "2026-10-06", "study": 0, "floor": 120, "status": "miss", "total": 0, "items": []}, {"d": "2026-10-07", "study": 0, "floor": 120, "status": "miss", "total": 0, "items": [{"cat": "sleep", "name": "睡眠", "range": "睡 03:14 → 起 09:30", "dur": "6h16m"}, {"cat": "other", "name": "上班", "range": "10:08", "dur": ""}, {"cat": "other", "name": "下班", "range": "18:50", "dur": ""}, {"cat": "log", "name": "打游戏", "range": "23:26 开始（进行中）", "dur": ""}]}, {"d": "2026-10-08", "study": 0, "floor": 120, "status": "miss", "total": 90, "items": [{"cat": "log", "name": "打游戏", "range": "23:26 → 00:56", "dur": "1h30m"}, {"cat": "sleep", "name": "睡眠", "range": "睡 02:30 → 起 12:24", "dur": "9h54m"}, {"cat": "other", "name": "上班", "range": "13:29", "dur": ""}, {"cat": "other", "name": "下班", "range": "18:08", "dur": ""}, {"cat": "log", "name": "洗澡", "range": "23:26 开始（进行中）", "dur": ""}]}, {"d": "2026-10-09", "study": 77, "floor": 120, "status": "miss", "total": 102, "items": [{"cat": "study", "name": "学习", "range": "00:32 → 00:41", "dur": "9m"}, {"cat": "study", "name": "学习", "range": "01:09 → 02:09", "dur": "1h"}, {"cat": "sleep", "name": "睡眠", "range": "睡 03:11 → 起 08:30", "dur": "5h19m"}, {"cat": "other", "name": "上班", "range": "09:34", "dur": ""}, {"cat": "other", "name": "下班", "range": "19:03", "dur": ""}, {"cat": "log", "name": "打游戏", "range": "20:20 → 20:45", "dur": "25m"}, {"cat": "study", "name": "学习", "range": "21:53 → 22:01", "dur": "8m"}, {"cat": "log", "name": "打游戏", "range": "23:29 开始（进行中）", "dur": ""}]}, {"d": "2026-10-10", "study": 67, "floor": 180, "status": "miss", "total": 186, "items": [{"cat": "log", "name": "打游戏", "range": "23:29 → 01:28", "dur": "1h59m"}, {"cat": "study", "name": "学习", "range": "03:34 → 04:17", "dur": "43m"}, {"cat": "study", "name": "学习", "range": "05:23 → 05:46", "dur": "23m"}, {"cat": "sleep", "name": "睡眠", "r ok", "total": 424, "items": [{"cat": "study", "name": "学习", "range": "21:50 → 03:01", "dur": "5h11m"}, {"cat": "sleep", "name": "起床", "range": "13:07（缺入睡记录）", "dur": "", "warn": true}, {"cat": "study", "name": "学习", "range": "20:48 → 22:41", "dur": "1h53m"}]}, {"d": "2026-10-11", "study": 0, "floor": 300, "status": "miss", "total": 0, "items": [{"cat": "study", "name": "学习", "range": "02:56 开始（进行中）", "dur": ""}]}], "weeks": [{"week": "2026-W41", "label": "W41", "study": 582, "floor_days": 1, "days": 6}], "months": [{"month": "2026-10", "label": "10月", "study": 582, "floor_days": 1, "days": 6}], "years": [{"year": "2026", "label": "2026", "study": 582, "floor_days": 1, "days": 6}], "this_week": {"study": 582, "floor_days": 1, "days": 6}, "this_month": {"study": 582, "floor_days": 1, "days": 6}, "this_year": {"study": 582, "floor_days": 1, "days": 6}, "balance": 4.0, "balance_trend": [{"week": "2026-W41", "balance": 4.0}], "card_dist": [], "fine_week": 0.0, "fine_total": 0, "rank": null, "total_floor": 1, "next_rank": "🥉 青铜", "remaining": 6, "rank_progress": 14, "at_top": false}], "cat_label": {"study": "📚 学习", "log": "🎮 通用打卡", "sleep": "😴 睡眠", "other": "🔧 其它"}, "transfer": {"payer": "pascal", "payee": "rora", "pname": "Pascal", "qname": "Rora", "amount": 100.0}};
const CL=DATA.cat_label;
let curP=0, curD=DATA.people[0].days.length-1, curW=DATA.people[0].weeks.length-1, curM=0, curY=0, mode='day';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
try{const p=parseInt(localStorage.getItem('hb_p'));if(p>=0&&p<DATA.people.length)curP=p;}catch(e){}
try{const d=parseInt(localStorage.getItem('hb_d'));if(d>=0&&d<DATA.people[curP].days.length)curD=d;}catch(e){}
function saveState(){try{localStorage.setItem('hb_p',curP);localStorage.setItem('hb_d',curD);}catch(e){}}
document.getElementById('updated').textContent=DATA.week+' · 更新 '+DATA.updated+' · 60s 自动刷新';
const tabs=document.getElementById('tabs');
DATA.people.forEach((p,i)=>{const b=document.createElement('button');
 b.className='tab'+(i===curP?' active':'');b.textContent=p.name;
 b.onclick=()=>{curP=i;curD=DATA.people[i].days.length-1;curW=DATA.people[i].weeks.length-1;curM=0;curY=0;selPerson();render();saveState();};
 tabs.appendChild(b);});
function selPerson(){[...tabs.children].forEach((t,i)=>t.className='tab'+(i===curP?' active':''));}
function fmt(m){if(!m)return'0';if(m<60)return m+'m';const h=Math.floor(m/60),mm=m%60;
 return h+'h'+(mm?String(mm).padStart(2,'0')+'m':'');}
const segD=document.getElementById('segD'),segW=document.getElementById('segW'),
      segM=document.getElementById('segM'),segY=document.getElementById('segY');
function selSeg(){segD.className=mode==='day'?'on':'';segW.className=mode==='week'?'on':'';
 segM.className=mode==='month'?'on':'';segY.className=mode==='year'?'on':'';}
segD.onclick=()=>{mode='day';selSeg();render();};
segW.onclick=()=>{mode='week';selSeg();render();};
segM.onclick=()=>{mode='month';selSeg();render();};
segY.onclick=()=>{mode='year';selSeg();render();};
function sparkSVG(p){
 const t=p.balance_trend;
 if(!t||t.length<2)return '';
 const W=110,H=32,pad=3;
 const vals=t.map(x=>x.balance);
 const mn=Math.min(...vals,0), mx=Math.max(...vals,0);
 const rng=(mx-mn)||1;
 const X=i=>pad+i*(W-2*pad)/(t.length-1);
 const Y=v=>pad+(mx-v)/rng*(H-2*pad);
 let d='M'+X(0).toFixed(1)+' '+Y(vals[0]).toFixed(1);
 for(let i=1;i<vals.length;i++)d+=' L'+X(i).toFixed(1)+' '+Y(vals[i]).toFixed(1);
 const zy=Y(0).toFixed(1);
 const up=vals[vals.length-1]>=vals[0];
 return '<svg width="'+W+'" height="'+H+'" style="display:block;margin-top:6px">'+
  '<line x1="'+pad+'" y1="'+zy+'" x2="'+(W-pad)+'" y2="'+zy+'" stroke="#e5e5ea" stroke-width="1"/>'+
  '<path d="'+d+'" fill="none" stroke="'+(up?'#34c759':'#ff3b30')+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
  '</svg>';
}
function cardHTML(p){
 const tw=p.this_week,tm=p.this_month,ym=DATA.updated.slice(0,7);
 return '<div class="card"><div class="t">本周 '+DATA.week+'</div><div class="v">'+
   '达标 '+tw.floor_days+'/'+tw.days+' 天 · '+fmt(tw.study)+'</div></div>'+
  '<div class="card"><div class="t">本月 '+ym+'</div><div class="v">'+
   '达标 '+tm.floor_days+'/'+tm.days+' 天 · '+fmt(tm.study)+'</div></div>'+
  '<div class="card"><div class="t">积分余额（周走势）</div><div class="v">'+p.balance+' 分</div>'+
   sparkSVG(p)+'</div>';
}
function renderDays(p,days,track,det){
 const max=Math.max(60,...days.map(d=>Math.max(d.study,d.floor)));
 days.forEach((d,i)=>{
  const col=document.createElement('div');col.className='col '+d.status+(i===curD?' sel':'');
  const bar=document.createElement('div');bar.className='bar';
  bar.style.height=Math.max(2,Math.round(200*d.study/max))+'px';col.appendChild(bar);
  if(d.floor>0){const f=document.createElement('div');f.className='ftick';
   f.style.bottom=Math.round(200*d.floor/max)+'px';col.appendChild(f);}
  const ml=document.createElement('div');ml.className='mlabel';ml.textContent=fmt(d.study);
  col.appendChild(ml);
  const dl=document.createElement('div');dl.className='dlabel';
  dl.textContent=d.d.slice(5).replace('-','/');col.appendChild(dl);
  col.onclick=()=>{curD=i;render();saveState();};
  track.appendChild(col);
 });
 const d=days[curD];
 const pill=d.status==='ok'?'达标':(d.status==='miss'?'未达标':'无保底');
 let h='<h2>'+d.d+'<span class="pill '+d.status+'">'+pill+'</span>'+
   '<span style="font-size:13px;color:#8e8e93;margin-left:8px">学习 '+fmt(d.study)+'/'+fmt(d.floor)+'</span></h2>';
 h+='<div class="daytot">⏱ 当天计时总时长 <b>'+fmt(d.total)+'</b>'+
    (d.total>0?'（含通用打卡，不计入保底）':'')+'</div>';
 if(!d.items.length)h+='<div class="empty">这天没有记录</div>';
 else{
  let curCat=null;
  d.items.forEach(it=>{
   if(it.cat!==curCat){curCat=it.cat;h+='<div class="cathead">'+esc(CL[it.cat]||it.cat)+'</div>';}
   h+='<div class="entry'+(it.warn?' warn':'')+'"><span>'+esc(it.name)+' <span class="rng">'+esc(it.range)+'</span></span>'+
      '<span class="dur">'+esc(it.dur)+'</span></div>';
  });
 }
 det.innerHTML=h;
}
function renderAgg(list,title,track,det,getCur,setCur){
 if(!list.length){track.innerHTML='';det.innerHTML='<div class="empty">还没有数据</div>';return;}
 let cur=getCur();
 if(cur>=list.length)cur=list.length-1;
 const max=Math.max(60,...list.map(w=>w.study));
 list.forEach((w,i)=>{
  const col=document.createElement('div');col.className='col'+(i===cur?' sel':'');
  const bar=document.createElement('div');bar.className='bar';
  bar.style.background=w.floor_days>=5?'#34c759':(w.floor_days>=3?'#ff9500':'#ff3b30');
  bar.style.height=Math.max(2,Math.round(200*w.study/max))+'px';col.appendChild(bar);
  const ml=document.createElement('div');ml.className='mlabel';ml.textContent=fmt(w.study);
  col.appendChild(ml);
  const dl=document.createElement('div');dl.className='dlabel';dl.textContent=w.label;col.appendChild(dl);
  col.onclick=()=>{setCur(i);render();};
  track.appendChild(col);
 });
 const w=list[cur];
 let h='<h2>'+w.label+'<span class="pill" style="background:#e8e8f0;color:#555">'+title+'</span></h2>';
 h+='<div class="daytot">学习 <b>'+fmt(w.study)+'</b> · 达标 <b>'+w.floor_days+'/'+w.days+'</b> 天</div>';
 det.innerHTML=h;
}
function renderWeeks(p,track,det){renderAgg(p.weeks,'周汇总',track,det,()=>curW,i=>{curW=i;});}
function renderMonths(p,track,det){renderAgg(p.months,'月汇总',track,det,()=>curM,i=>{curM=i;});}
function renderYears(p,track,det){renderAgg(p.years,'年汇总',track,det,()=>curY,i=>{curY=i;});}
function distHTML(p){
 const d=p.card_dist||[];
 const total=d.reduce((a,b)=>a+b[1],0);
 if(!d.length)return '<div class="t">🎟 愿望卡消费</div><div class="dempty">还没用过愿望卡（14 分换 1 张，发「用卡 用途」）</div>';
 const colors=['#ff9500','#ff6b6b','#4ecdc4','#a29bfe','#fdcb6e','#b2bec3'];
 let h='<div class="t">🎟 愿望卡消费分布（共 '+total+' 张）</div>';
 d.forEach((x,i)=>{
  const cat=x[0],n=x[1],pct=Math.round(n/total*100);
  h+='<div class="drow"><span class="dlab">'+cat+'</span>'+
     '<div class="dbar"><div class="dfill" style="width:'+pct+'%;background:'+(colors[i%colors.length])+'"></div></div>'+
     '<span class="dnum">'+n+' 张</span></div>';
 });
 return h;
}
function moneyRankHTML(p){
 let h='<div class="t">💰 罚款：本周 <b>'+p.fine_week+' 元</b> · 累计 '+p.fine_total+' 元</div>';
 if(p.rank){
  h+='<div class="rankline"><span class="rlab">🏅 '+p.rank+'</span>'+
     '<span class="rnum">累计 '+p.total_floor+' 天'+
     (p.at_top?' · 已到顶':' · 距 '+p.next_rank+' 还差 '+p.remaining+' 天')+'</span></div>';
  if(!p.at_top){
   h+='<div class="dbar"><div class="dfill" style="width:'+p.rank_progress+'%;background:#007aff"></div></div>';
  }
 }
 return h;
}
function render(){
