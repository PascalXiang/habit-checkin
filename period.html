<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🩸 经期记录</title><style>
:root{
--fg:#18181b;--fg2:#4b5563;--muted:#8b8b93;--line:#ececf1;
--bg:#f4f4f7;--card:#fff;--accent:#0a7cff;--accent-2:#eaf3ff;
--green:#16a34a;--green-2:#e7f7ee;--red:#e5484d;--red-2:#fdecec;
--purple:#7c3aed;--purple-2:#f3ecfe;--amber:#d97706;--gray:#d4d4d8;
--r-lg:18px;--r-md:12px;--r-sm:8px;
--sh:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 44px}
/* flex-wrap + min-width:0：320px 下 .updated（flex-shrink:0 时宽 284）会把整个页面撑宽 15px，
   页面就能横向拖动了（2026-10-12 实测）。允许它换行/收缩就不会溢出。*/
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin:0 0 16px}
h1{font-size:21px;line-height:1.25;margin:0;letter-spacing:-.02em;font-weight:700}
.updated{color:var(--muted);font-size:12px;line-height:1.45;text-align:right;flex-shrink:1;min-width:0}
@media(max-width:360px){.updated{font-size:11px}}
.nav{display:flex;gap:6px;margin:0 0 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;
scrollbar-width:none;padding-bottom:2px}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:1 1 0;min-width:0;white-space:nowrap;text-align:center;padding:9px 4px;border-radius:var(--r-md);
background:var(--card);box-shadow:var(--sh);font-size:12.5px;color:var(--fg2);text-decoration:none}
.nav a.on{background:var(--accent);color:#fff;font-weight:600}
.tabs{display:flex;gap:8px;margin:0 0 14px}
.tab{flex:1;padding:11px;border:none;border-radius:var(--r-md);background:var(--card);box-shadow:var(--sh);
font:600 15px/1 inherit;color:var(--fg2);cursor:pointer}
.tab.active{background:var(--accent);color:#fff}
/* 注意：.person 只作 JS 钩子（子页 Tab 切换用 display 显隐），不需要任何样式 */
.panel,.distsec,.detail,.chartbox{background:var(--card);border-radius:var(--r-lg);padding:16px;
overflow-wrap:anywhere;
box-shadow:var(--sh);margin:0 0 14px}
.panel h2,.detail h2{font-size:16px;line-height:1.35;margin:0 0 10px;font-weight:700}
.panel h3{font-size:12px;color:var(--muted);margin:16px 0 8px;font-weight:600;letter-spacing:.02em}
.sec-t{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 10px}
.sumline{font-size:13.5px;line-height:1.75;color:var(--fg2);margin:0 0 10px}
.sumline b{color:var(--fg)}
.summary{font-size:13px;line-height:1.6;color:var(--fg2);margin:0 0 12px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 0 14px}
@media(min-width:640px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:var(--card);border-radius:var(--r-lg);padding:14px;box-shadow:var(--sh);min-width:0}
.card .t{font-size:12px;line-height:1.5;color:var(--muted)}
.card .v{font-size:19px;line-height:1.3;font-weight:700;margin:4px 0 2px;letter-spacing:-.01em}
.card .sub{font-size:12px;line-height:1.6;color:var(--fg2);margin-top:2px}
.card .sub b{color:var(--fg)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12px}
tr:last-child td{border-bottom:none}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px}
.tag.ok{background:var(--green-2);color:var(--green)}
.tag.bad{background:var(--red-2);color:var(--red)}
.tag.warn{background:#f4f4f7;color:var(--fg2)}
.empty{color:var(--muted);font-size:14px;line-height:1.6;padding:8px 0}
.hint{color:var(--muted);font-size:12px;line-height:1.7;text-align:center;margin:16px 0 0}

.bars{display:flex;align-items:flex-end;gap:8px;padding-top:10px;overflow-x:auto;
-webkit-overflow-scrolling:touch;scrollbar-width:none}
.bars::-webkit-scrollbar{display:none}
.barhd{font-size:11px;line-height:1.4;color:var(--muted);text-align:right;margin:0 0 -4px}
.barcol{flex:0 0 46px;display:flex;flex-direction:column;align-items:center;gap:6px}
.barcol .val{font-size:11px;line-height:1.4;color:var(--fg2);white-space:nowrap}
.barcol .fill{width:26px;background:var(--accent);border-radius:6px 6px 0 0;min-height:3px}
.barcol .fill.alt{background:var(--floor,#0a84ff)}
.barcol .lbl{font-size:11px;line-height:1.4;color:var(--muted);white-space:nowrap}
/* 320px 下 5 列 ×46px + 4×8px 间距 = 262 > 可用 256，会多出 6px 横向滚动（2026-10-12）*/
@media(max-width:340px){.bars{gap:6px}.barcol{flex:0 0 42px;gap:4px}
.barcol .val,.barcol .lbl,.barhd{font-size:10px}}   /* 必须放在 .barcol 定义之后，否则被覆盖 */
.pm-bar{display:flex;gap:6px;overflow-x:auto;margin:12px 0 10px;scrollbar-width:none}
.pm-bar::-webkit-scrollbar{display:none}
.pm{border:none;border-radius:99px;padding:7px 14px;background:#f1f1f5;color:var(--fg2);
font:600 13px/1 inherit;cursor:pointer;white-space:nowrap}
.pm.on{background:var(--accent);color:#fff}
.pm-panel[hidden]{display:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:360px}
.ch{text-align:center;font-size:11px;color:var(--muted);padding:3px 0}
.cd{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:9px;
font-size:12.5px;color:var(--fg2);background:#f7f7fa}
.cd.pad{background:transparent}
.cd.on{background:#ffd6e0;color:#c2185b;font-weight:700}
.panel.toilet .cd.on{background:#d6e8ff;color:#1565c0}   /* 如厕用蓝，别跟经期的粉混 */
.cd.today{outline:2px solid var(--accent);outline-offset:-2px}
.pm-range{font-size:13px;line-height:2;margin:12px 0 0}
</style></head><body><div class="wrap"><header><h1>🩸 经期记录</h1><span class="updated">更新 2026-10-29 19:10</span></header><div class="nav"><a href="index.html">📊 学习</a><a href="sleep.html">😴 睡眠</a><a href="ride.html">🚲 骑行</a><a href="toilet.html">🚽 如厕</a><a href="period.html" class="on">🩸 经期</a></div><div class="tabs" id="tabs"></div><div class="person" data-name="Rora"><div class="panel"><h2>🩸 Rora 经期</h2><p class="sumline">最近一次 10-02 → 10-09（8 天） · 平均 8.0 天</p><div class="pm-bar"><button class="pm on" data-m="2026-10">2026 年 10 月</button></div><div class="pm-panel" data-m="2026-10"><div class="cal"><div class="ch">一</div><div class="ch">二</div><div class="ch">三</div><div class="ch">四</div><div class="ch">五</div><div class="ch">六</div><div class="ch">日</div><div class="cd pad"></div><div class="cd pad"></div><div class="cd pad"></div><div class="cd">1</div><div class="cd on">2</div><div class="cd on">3</div><div class="cd on">4</div><div class="cd on">5</div><div class="cd on">6</div><div class="cd on">7</div><div class="cd on">8</div><div class="cd on">9</div><div class="cd">10</div><div class="cd">11</div><div class="cd">12</div><div class="cd">13</div><div class="cd">14</div><div class="cd">15</div><div class="cd">16</div><div class="cd">17</div><div class="cd">18</div><div class="cd">19</div><div class="cd">20</div><div class="cd">21</div><div class="cd">22</div><div class="cd">23</div><div class="cd">24</div><div class="cd">25</div><div class="cd">26</div><div class="cd">27</div><div class="cd">28</div><div class="cd today">29</div><div class="cd">30</div><div class="cd">31</div></div><p class="pm-range">🩸 10-02 → 10-09（8 天）</p></div><p class="pm-range">_粉底 = 经期日；蓝框 = 今天_</p><script>(function(){var s=document.currentScript, bar=s.parentNode.querySelector('.pm-bar');bar.addEventListener('click',function(e){var b=e.target.closest('.pm');if(!b)return;bar.querySelectorAll('.pm').forEach(function(x){x.classList.remove('on');});b.classList.add('on');s.parentNode.querySelectorAll('.pm-panel').forEach(function(pp){if(pp.dataset.m===b.dataset.m)pp.removeAttribute('hidden');else pp.setAttribute('hidden','');});});})();</script></div></div><p class="hint">每 5 分钟自动刷新</p><script>(function(){try{var y=parseInt(sessionStorage.getItem("hb_sy2"));if(y>0){window.scrollTo(0,y);sessionStorage.removeItem("hb_sy2");requestAnimationFrame(function(){window.scrollTo(0,y);});}}catch(e){}})();var HB_R2=300000; function hbReload2(){try{sessionStorage.setItem("hb_sy2",String(window.scrollY));}catch(e){}var u=new URL(location.href);u.searchParams.set("t",Date.now());location.replace(u.toString());}setTimeout(function(){if(document.hidden){document.addEventListener("visibilitychange",function(){if(document.hidden)return;document.removeEventListener("visibilitychange",arguments.callee);hbReload2();});return;}hbReload2();},HB_R2);</script><script>
(function(){
var ps=[].slice.call(document.querySelectorAll('.person'));
var tabsEl=document.getElementById('tabs');
if(!ps.length)return;
if(ps.length<2)tabsEl.style.display='none';   /* 只有一个人（如经期页）就不摆 Tab */
var curP=0;
try{var s=parseInt(localStorage.getItem('hb_p'));if(!isNaN(s)&&s>=0&&s<ps.length)curP=s;}catch(e){}
function sel(i){curP=i;try{localStorage.setItem('hb_p',i);}catch(e){}
 ps.forEach(function(p,j){p.style.display=j===i?'':'none';});
 [].slice.call(tabsEl.children).forEach(function(t,j){t.className='tab'+(j===i?' active':'');});}
ps.forEach(function(p,i){var b=document.createElement('button');b.className='tab';
 b.textContent=p.getAttribute('data-name');
 b.onclick=function(){sel(i);};tabsEl.appendChild(b);});
sel(curP);
})();
</script></div></body></html>
