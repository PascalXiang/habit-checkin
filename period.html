<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🩸 经期记录</title><style>:root{--fg:#1c1c1e;--muted:#8e8e93;--green:#34c759;--red:#ff3b30;
--gray:#c7c7cc;--floor:#0a84ff;--bg:#f2f2f7;--card:#fff;--accent:#007aff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,"PingFang SC",sans-serif;
color:var(--fg);-webkit-tap-highlight-color:transparent}
.wrap{max-width:1020px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px 10px}
h1{font-size:24px;margin:0}
.updated{color:var(--muted);font-size:12px}
.nav{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.nav a{flex:1 0 auto;white-space:nowrap;text-align:center;padding:9px 8px;border-radius:12px;
background:var(--card);font-size:clamp(11px,3.1vw,14px);color:var(--muted);
text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.nav a.on{background:var(--accent);color:#fff}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:10px;border:none;border-radius:12px;background:var(--card);
font-size:15px;color:var(--muted);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tab.active{background:var(--accent);color:#fff}
.panel{background:var(--card);border-radius:16px;padding:14px 16px;margin:0 0 12px;
box-shadow:0 1px 4px rgba(0,0,0,.06)}
.panel h2{font-size:16px;margin:0 0 10px}
.panel h3{font-size:13px;color:var(--muted);margin:14px 0 8px;font-weight:600}
.sumline{font-size:14px;margin:0 0 4px}
.bar{display:flex;align-items:flex-end;gap:5px;padding-top:8px;overflow-x:auto}
.bar .b{flex:0 0 44px;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar .fill{width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.bar .fill.alt{background:var(--floor)}
.bar .val{font-size:10px;color:var(--fg);white-space:nowrap}
.bar .lbl{font-size:10px;color:var(--muted);white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid #f0f0f0}
th{color:var(--muted);font-weight:500;font-size:12px}
.tag{display:inline-block;padding:4px 10px;border-radius:8px;font-size:13px}
.tag.ok{background:#e8f8ee;color:var(--green)}
.tag.bad{background:#fde8e8;color:var(--red)}
.tag.warn{background:#f2f2f7;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.hint{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
/* 经期月历（2026-10-09）：以「月」为单位看区间，不是次数 */
.pm-bar{display:flex;gap:6px;overflow-x:auto;margin:10px 0 8px}
.pm{border:none;border-radius:10px;padding:6px 12px;background:#f2f2f7;color:var(--muted);
font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit}
.pm.on{background:var(--accent);color:#fff}
.pm-panel[hidden]{display:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;max-width:380px}
.ch{text-align:center;font-size:11px;color:var(--muted);padding:2px 0}
.cd{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;
font-size:12px;color:var(--fg);background:#fafafa}
.cd.pad{background:transparent}
.cd.on{background:#ffd6e0;color:#c2185b;font-weight:700}
.cd.today{outline:2px solid var(--accent);outline-offset:-2px}
.pm-range{font-size:13px;margin:10px 0 0;line-height:1.9}</style></head><body><div class="wrap"><header><h1>🩸 经期记录</h1><span class="updated">更新 2026-10-10 16:40</span></header><div class="nav"><a href="index.html">📊 学习</a><a href="sleep.html">😴 睡眠</a><a href="ride.html">🚲 骑行</a><a href="toilet.html">🚽 如厕</a><a href="period.html" class="on">🩸 经期</a></div><div class="tabs" id="tabs"></div><div class="person" data-name="Rora"><div class="panel"><h2>🩸 Rora 经期</h2><p class="sumline">最近一次 10-02 → 10-09（8 天） · 平均 8.0 天</p><div class="pm-bar"><button class="pm on" data-m="2026-10">2026 年 10 月</button></div><div class="pm-panel" data-m="2026-10"><div class="cal"><div class="ch">一</div><div class="ch">二</div><div class="ch">三</div><div class="ch">四</div><div class="ch">五</div><div class="ch">六</div><div class="ch">日</div><div class="cd pad"></div><div class="cd pad"></div><div class="cd pad"></div><div class="cd">1</div><div class="cd on">2</div><div class="cd on">3</div><div class="cd on">4</div><div class="cd on">5</div><div class="cd on">6</div><div class="cd on">7</div><div class="cd on">8</div><div class="cd on">9</div><div class="cd today">10</div><div class="cd">11</div><div class="cd">12</div><div class="cd">13</div><div class="cd">14</div><div class="cd">15</div><div class="cd">16</div><div class="cd">17</div><div class="cd">18</div><div class="cd">19</div><div class="cd">20</div><div class="cd">21</div><div class="cd">22</div><div class="cd">23</div><div class="cd">24</div><div class="cd">25</div><div class="cd">26</div><div class="cd">27</div><div class="cd">28</div><div class="cd">29</div><div class="cd">30</div><div class="cd">31</div></div><p class="pm-range">🩸 10-02 → 10-09（8 天）</p></div><p class="pm-range">_粉底 = 经期日；蓝框 = 今天_</p><script>(function(){
var s=document.currentScript, bar=s.parentNode.querySelector('.pm-bar');
bar.addEventListener('click',function(e){var b=e.target.closest('.pm');if(!b)return;
 bar.querySelectorAll('.pm').forEach(function(x){x.classList.remove('on');});
 b.classList.add('on');
 s.parentNode.querySelectorAll('.pm-panel').forEach(function(pp){
  if(pp.dataset.m===b.dataset.m)pp.removeAttribute('hidden');
  else pp.setAttribute('hidden','');});});})();</script></div></div><p class="hint">每 60 秒自动刷新</p><script>setTimeout(function(){var u=new URL(location.href);u.searchParams.set("t",Date.now());location.replace(u.toString());},60000);</script><script>
(function(){
var ps=[].slice.call(document.querySelectorAll('.person'));
var tabsEl=document.getElementById('tabs');
if(!ps.length)return;
if(ps.length<2)tabsEl.style.display='none';   /* 只有一个人（如经期页）就不摆 Tab */
var curP=0;
try{var s=parseInt(localStorage.getItem('hb_p'));if(!isNaN(s)&&s>=0&&s<ps.length)curP=s;}catch(e){}
function sel(i){curP=i;try{localStorage.setItem('hb_p',i);}catch(e){}
 ps.forEach(function(p,j){p.style.display=j===i?'':'none';});
 [].slice.call(tabsEl.children).forEach(function(t,j){t.className='tab'+(j===i?' active':'');});}
ps.forEach(function(p,i){var b=document.createElement('button');b.className='tab';
 b.textContent=p.getAttribute('data-name');
 b.onclick=function(){sel(i);};tabsEl.appendChild(b);});
sel(curP);
})();
</script></div></body></html>
