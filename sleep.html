<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>😴 睡眠作息</title><style>:root{--fg:#1c1c1e;--muted:#8e8e93;--green:#34c759;--red:#ff3b30;
--gray:#c7c7cc;--floor:#0a84ff;--bg:#f2f2f7;--card:#fff;--accent:#007aff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,"PingFang SC",sans-serif;
color:var(--fg);-webkit-tap-highlight-color:transparent}
.wrap{max-width:1020px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px 10px}
h1{font-size:24px;margin:0}
.updated{color:var(--muted);font-size:12px}
.nav{display:flex;gap:8px;margin-bottom:14px}
.nav a{flex:1;text-align:center;padding:10px;border-radius:12px;background:var(--card);
font-size:14px;color:var(--muted);text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.nav a.on{background:var(--accent);color:#fff}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:10px;border:none;border-radius:12px;background:var(--card);
font-size:15px;color:var(--muted);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tab.active{background:var(--accent);color:#fff}
.panel{background:var(--card);border-radius:16px;padding:14px 16px;margin:0 0 12px;
box-shadow:0 1px 4px rgba(0,0,0,.06)}
.panel h2{font-size:16px;margin:0 0 10px}
.panel h3{font-size:13px;color:var(--muted);margin:14px 0 8px;font-weight:600}
.sumline{font-size:14px;margin:0 0 4px}
.bar{display:flex;align-items:flex-end;gap:5px;padding-top:8px;overflow-x:auto}
.bar .b{flex:0 0 44px;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar .fill{width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.bar .fill.alt{background:var(--floor)}
.bar .val{font-size:10px;color:var(--fg);white-space:nowrap}
.bar .lbl{font-size:10px;color:var(--muted);white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid #f0f0f0}
th{color:var(--muted);font-weight:500;font-size:12px}
.tag{display:inline-block;padding:4px 10px;border-radius:8px;font-size:13px}
.tag.ok{background:#e8f8ee;color:var(--green)}
.tag.bad{background:#fde8e8;color:var(--red)}
.tag.warn{background:#f2f2f7;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.hint{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}</style></head><body><div class="wrap"><header><h1>😴 睡眠作息</h1><span class="updated">更新 2026-10-08 11:40</span></header><div class="nav"><a href="index.html">📊 学习</a><a href="sleep.html" class="on">😴 睡眠作息</a><a href="ride.html">🚲 骑行</a></div><div class="tabs" id="tabs"></div><div class="person" data-name="Pascal"><div class="panel"><h2>😴 Pascal 睡眠时长（最近 14 天）</h2><div class="bar"><div class="b"><span class="val">6h16m</span><div class="fill" style="height:100px"></div><span class="lbl">10-07</span></div></div><h3>明细（睡了 → 起床）</h3><table><tr><th>日期</th><th>睡了</th><th>起床</th><th>时长</th></tr><tr><td>10-07</td><td>03:14</td><td>09:30</td><td>6h16m</td></tr></table></div><div class="panel"><h2>🏢 上下班记录（本周）</h2><table><tr><th>日期</th><th>上班</th><th>下班</th></tr><tr><td>10-07</td><td>10:08</td><td>18:50</td></tr></table></div></div><div class="person" data-name="Rora"><div class="panel"><h2>😴 Rora 睡眠时长（最近 14 天）</h2><div class="bar"><div class="b"><span class="val">8h10m</span><div class="fill" style="height:100px"></div><span class="lbl">10-07</span></div></div><h3>明细（睡了 → 起床）</h3><table><tr><th>日期</th><th>睡了</th><th>起床</th><th>时长</th></tr><tr><td>10-07</td><td>04:26</td><td>12:36</td><td>8h10m</td></tr></table></div><div class="panel"><h2>⏰ 起床波动（本周）</h2><span class="tag warn">— 记录不足（1/3 天）</span></div></div><p class="hint">每 60 秒自动刷新</p><script>setTimeout(function(){var u=new URL(location.href);u.searchParams.set("t",Date.now());location.replace(u.toString());},60000);</script><script>
(function(){
var ps=[].slice.call(document.querySelectorAll('.person'));
var tabsEl=document.getElementById('tabs');
if(!ps.length)return;
var curP=0;
try{var s=parseInt(localStorage.getItem('hb_p'));if(!isNaN(s)&&s>=0&&s<ps.length)curP=s;}catch(e){}
function sel(i){curP=i;try{localStorage.setItem('hb_p',i);}catch(e){}
 ps.forEach(function(p,j){p.style.display=j===i?'':'none';});
 [].slice.call(tabsEl.children).forEach(function(t,j){t.className='tab'+(j===i?' active':'');});}
ps.forEach(function(p,i){var b=document.createElement('button');b.className='tab';
 b.textContent=p.getAttribute('data-name');
 b.onclick=function(){sel(i);};tabsEl.appendChild(b);});
sel(curP);
})();
</script></div></body></html>
