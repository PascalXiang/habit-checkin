<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>😴 睡眠作息</title><style>:root{--fg:#1c1c1e;--muted:#8e8e93;--green:#34c759;--red:#ff3b30;
--gray:#c7c7cc;--floor:#0a84ff;--bg:#f2f2f7;--card:#fff;--accent:#007aff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,"PingFang SC",sans-serif;
color:var(--fg);-webkit-tap-highlight-color:transparent}
.wrap{max-width:1020px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px 10px}
h1{font-size:24px;margin:0}
.updated{color:var(--muted);font-size:12px}
.nav{display:flex;gap:8px;margin-bottom:14px}
.nav a{flex:1;text-align:center;padding:10px;border-radius:12px;background:var(--card);
font-size:14px;color:var(--muted);text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.nav a.on{background:var(--accent);color:#fff}
.panel{background:var(--card);border-radius:16px;padding:14px 16px;margin:0 0 12px;
box-shadow:0 1px 4px rgba(0,0,0,.06)}
.panel h2{font-size:16px;margin:0 0 10px}
.panel h3{font-size:13px;color:var(--muted);margin:14px 0 8px;font-weight:600}
.sumline{font-size:14px;margin:0 0 4px}
.bar{display:flex;align-items:flex-end;gap:5px;padding-top:8px;overflow-x:auto}
.bar .b{flex:0 0 44px;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar .fill{width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.bar .fill.alt{background:var(--floor)}
.bar .val{font-size:10px;color:var(--fg);white-space:nowrap}
.bar .lbl{font-size:10px;color:var(--muted);white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid #f0f0f0}
th{color:var(--muted);font-weight:500;font-size:12px}
.tag{display:inline-block;padding:4px 10px;border-radius:8px;font-size:13px}
.tag.ok{background:#e8f8ee;color:var(--green)}
.tag.bad{background:#fde8e8;color:var(--red)}
.tag.warn{background:#f2f2f7;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.hint{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}</style></head><body><div class="wrap"><header><h1>😴 睡眠作息</h1><span class="updated">更新 2026-10-07 12:50</span></header><div class="nav"><a href="index.html">📊 学习</a><a href="sleep.html" class="on">😴 睡眠作息</a><a href="ride.html">🚲 骑行</a></div><div class="panel"><h2>😴 Rora 睡眠时长（最近 14 天，单位 min）</h2><div class="bar"><div class="b"><span class="val">490</span><div class="fill" style="height:100px"></div><span class="lbl">10-07</span></div></div></div><div class="panel"><h2>⏰ 起床波动（本周）</h2><span class="tag warn">— 记录不足（1/3 天）</span></div><div class="panel"><h2>🏢 Pascal 上班记录（本周）</h2><table><tr><th>日期</th><th>上班</th></tr><tr><td>10-07</td><td>10:08</td></tr></table></div><p class="hint">数据每 5 分钟自动刷新</p></div></body></html>
